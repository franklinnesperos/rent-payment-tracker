<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centralized Rent & Payment Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tesseract.js (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md space-y-6">
    
    <div class="flex justify-between items-center border-b pb-4">
      <h1 class="text-2xl font-bold text-gray-800">Rent & Payment Tracker</h1>
      <span id="syncStatus" class="text-xs bg-yellow-100 text-yellow-800 font-semibold px-2.5 py-1 rounded">Kumokonekta...</span>
    </div>

    <!-- Upload & OCR Section -->
    <div class="border-2 border-dashed border-gray-300 p-4 rounded-lg text-center">
      <h2 class="text-lg font-semibold mb-2">Scan QR / Upload Resibo</h2>
      <input type="file" id="receiptInput" accept="image/*" class="mb-3">
      <div id="ocrStatus" class="text-sm text-blue-600 font-medium"></div>
    </div>

    <!-- Payment Form -->
    <div class="bg-gray-50 p-4 rounded-lg space-y-3">
      <h3 class="font-semibold text-gray-700">Mag-log ng Bagong Bayad</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-500">Ref Number</label>
          <input type="text" id="refNum" class="w-full border p-2 rounded" placeholder="e.g. TXN123456">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500">Cash Amount ($)</label>
          <input type="number" id="cashAmount" value="0" class="w-full border p-2 rounded">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500">Online/Transfer ($)</label>
          <input type="number" id="onlineAmount" value="0" class="w-full border p-2 rounded">
        </div>
      </div>
      <button id="btnSubmit" onclick="processPayment()" class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700">
        I-save at I-sync ang Bayad
      </button>
    </div>

    <!-- Schedule Table -->
    <div>
      <h2 class="text-xl font-bold mb-3">Weekly Schedule & Live Status</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-200 text-gray-700 text-sm">
              <th class="p-3">Week</th>
              <th class="p-3">Petsa (Date Range)</th>
              <th class="p-3">Kailangan ($135)</th>
              <th class="p-3">Naibayad</th>
              <th class="p-3">Status</th>
              <th class="p-3">Details</th>
            </tr>
          </thead>
          <tbody id="scheduleBody">
            <!-- Dynamic rows will render here -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ PALITAN ITO NG FIREBASE CONFIG CREDENTIALS MO
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const WEEKLY_RATE = 135;
    const START_DATE = new Date("2026-08-30"); // Aug 30 Start Date
    let weeksData = [];

    // Initialize 12 Weeks template
    function generateDefaultWeeks() {
      let currentDate = new Date(START_DATE);
      let list = [];
      for (let i = 1; i <= 12; i++) {
        let endDate = new Date(currentDate);
        endDate.setDate(endDate.getDate() + 6);
        list.push({
          weekNum: i,
          startDate: formatDate(currentDate),
          endDate: formatDate(endDate),
          targetAmount: WEEKLY_RATE,
          paidAmount: 0,
          status: 'UNPAID',
          payments: []
        });
        currentDate.setDate(currentDate.getDate() + 7);
      }
      return list;
    }

    function formatDate(d) {
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // Real-time Firestore Listener (Kahit sinong mag-open ng link, makikita ang latest state)
    const docRef = doc(db, "rent_tracker", "master_records");

    onSnapshot(docRef, (docSnap) => {
      const syncStatus = document.getElementById('syncStatus');
      if (docSnap.exists()) {
        weeksData = docSnap.data().weeks;
      } else {
        weeksData = generateDefaultWeeks();
        saveToFirebase(weeksData);
      }
      renderTable();
      syncStatus.innerText = "Live Synced";
      syncStatus.className = "text-xs bg-green-100 text-green-800 font-semibold px-2.5 py-1 rounded";
    }, (error) => {
      console.error("Firestore Error:", error);
      document.getElementById('syncStatus').innerText = "Sync Error";
    });

    async function saveToFirebase(data) {
      try {
        await setDoc(doc(db, "rent_tracker", "master_records"), { weeks: data });
      } catch (e) {
        alert("Nagka-error sa pag-save sa Cloud database.");
      }
    }

    // Payment Processing Logic
    window.processPayment = async function() {
      const cash = parseFloat(document.getElementById('cashAmount').value) || 0;
      const online = parseFloat(document.getElementById('onlineAmount').value) || 0;
      const ref = document.getElementById('refNum').value || 'N/A';
      
      let totalPayment = cash + online;
      if (totalPayment <= 0) return alert("Maglagay ng halaga ng bayad.");

      let remainingPayment = totalPayment;

      for (let w of weeksData) {
        if (remainingPayment <= 0) break;

        let needed = w.targetAmount - w.paidAmount;
        if (needed > 0) {
          let toApply = Math.min(needed, remainingPayment);
          w.paidAmount += toApply;
          remainingPayment -= toApply;

          w.status = w.paidAmount >= w.targetAmount ? 'PAID' : 'PARTIAL';

          w.payments.push({
            amount: toApply,
            type: cash > 0 && online > 0 ? 'Hybrid' : (cash > 0 ? 'Cash' : 'Online'),
            ref: ref,
            timestamp: new Date().toLocaleDateString()
          });
        }
      }

      await saveToFirebase(weeksData);

      document.getElementById('cashAmount').value = 0;
      document.getElementById('onlineAmount').value = 0;
      document.getElementById('refNum').value = '';
    }

    function renderTable() {
      const tbody = document.getElementById('scheduleBody');
      tbody.innerHTML = '';

      weeksData.forEach(w => {
        let badgeColor = w.status === 'PAID' ? 'bg-green-100 text-green-800' :
                         w.status === 'PARTIAL' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800';

        let row = `
          <tr class="border-b text-sm">
            <td class="p-3 font-semibold">Week ${w.weekNum}</td>
            <td class="p-3">${w.startDate} - ${w.endDate}</td>
            <td class="p-3">$${w.targetAmount}</td>
            <td class="p-3 font-medium text-blue-600">$${w.paidAmount}</td>
            <td class="p-3"><span class="px-2 py-1 rounded text-xs font-bold ${badgeColor}">${w.status}</span></td>
            <td class="p-3 text-xs text-gray-500">${w.payments ? w.payments.map(p => `${p.type}: $${p.amount} (Ref: ${p.ref})`).join('<br>') : ''}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    // OCR Receipt Scanner
    document.getElementById('receiptInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById('ocrStatus');
      status.innerText = "Binabasa ang resibo... Paki-hintay.";

      Tesseract.recognize(file, 'eng').then(({ data: { text } }) => {
        status.innerText = "Natapos ang pag-scan!";
        
        const amountMatch = text.match(/\$?(\d+(\.\d{1,2})?)/);
        const refMatch = text.match(/(Ref|TXN|Reference|No)[\s#:]*([A-Za-z0-9]+)/i);

        if (amountMatch) document.getElementById('onlineAmount').value = amountMatch[1];
        if (refMatch) document.getElementById('refNum').value = refMatch[2];
      }).catch(err => {
        status.innerText = "Error sa pag-read ng resibo.";
      });
    });
  </script>
</body>
</html>
